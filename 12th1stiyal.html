<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>12ஆம் வகுப்பு தமிழ் - இயல் 1 வினாடி வினா</title>
    <link rel="stylesheet" href="12th1stiyal.css">
</head>
<body>

<div class="quiz-container">
    <header>
        <h1>📚 12ஆம் வகுப்பு தமிழ்</h1>
        <h2>இயல் 1 - வினாடி வினா</h2>
    </header>

    <section id="student-section" class="card">
        <h3>📝 மாணவர் விவரங்கள்</h3>

        <label for="studentName">மாணவர் பெயர்</label>
        <input type="text" id="studentName" placeholder="மாணவர் பெயரை உள்ளிடுக">

        <label for="examNo">தேர்வு எண்</label>
        <input type="text" id="examNo" placeholder="தேர்வு எண்ணை உள்ளிடுக">

        <label for="studentClass">வகுப்பு</label>
        <input type="text" id="studentClass" placeholder="எ.கா. 12 - அ">

        <button id="nextBtn" class="primary-btn">NEXT ➡️</button>
    </section>

    <section id="quiz-section" class="hidden">
        <div class="top-bar">
            <span id="studentInfo"></span>
            <span id="timer">⏱️ 20:00</span>
        </div>

        <div id="question-number"></div>
        <div id="quiz"></div>

        <div class="nav-buttons">
            <button id="prevBtn" class="secondary-btn">⬅️ முந்தையது</button>
            <button id="nextQuestionBtn" class="primary-btn">அடுத்தது ➡️</button>
            <button id="submitBtn" class="submit-btn hidden">விடைத்தாளைச் சமர்ப்பிக்கவும் ✅</button>
        </div>
    </section>

    <section id="result-section" class="hidden card">
        <h2>🎉 தேர்வு முடிவு</h2>
        <div id="resultInfo"></div>
        <div id="score"></div>
        <div id="wrongAnswers"></div>
        <button id="printBtn" class="primary-btn">🖨️ சான்றிதழ் / முடிவை அச்சிடுக</button>
        <button id="restartBtn" class="secondary-btn">🔄 மீண்டும் தொடங்குக</button>
    </section>
</div>

<script src="12th1stiyal.js"></script>
</body>
</html>
